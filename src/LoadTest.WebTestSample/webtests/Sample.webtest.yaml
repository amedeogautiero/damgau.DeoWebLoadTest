version: 1
name: Test Example

defaults:
  timeoutSec: 15
  followRedirects: true
  parseDependentRequests: false

steps:
  - name: Homepage
    request:
      method: GET
      url: https://example.com/
    expectedStatus: 200    
    extract:
      - name: AgeValue
        type: header
        header: Age

  - code: CalcolaValore
  - name: es2
    request:
      method: GET
      url: https://example.com/
      headers:
        Age: ${{AgeValue}}
    expectedStatus: 200    

  - name: es3
    request:
      method: GET
      url: https://example.com/
    expectedStatus: 200        